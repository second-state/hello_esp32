[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# OTA 分区表,app 烧进 ota_0(首启槽;OTA 更新写 ota_1,见 partitions.csv / build.sh)
runner = "espflash flash --monitor --flash-size 16mb --partition-table partitions.csv --target-app-partition ota_0"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU="esp32s3"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
ESP_IDF_VERSION = "v5.2.3"

